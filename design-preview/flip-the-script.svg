<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1060" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="20%" r="75%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="50%" cy="20%" r="75%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162a4d"/>
      <stop offset="1" stop-color="#101723"/>
    </linearGradient>
    <marker id="arrGray" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#6c717c"/>
    </marker>
    <marker id="arrBlue" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#5b9bff"/>
    </marker>
    <marker id="arrRed" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 Z" fill="#ef4444"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1680" height="1060" fill="url(#bg)"/>
  <rect x="60" y="120" width="700" height="880" fill="url(#glowRed)"/>
  <rect x="920" y="120" width="700" height="880" fill="url(#glowBlue)"/>

  <!-- title -->
  <text x="840" y="62" text-anchor="middle" font-size="16" letter-spacing="4" fill="#5b9bff" font-family="monospace">FLIP THE SCRIPT · MESSAGING, REVERSED</text>
  <text x="840" y="104" text-anchor="middle" font-size="30" font-weight="700" fill="#f4f5f7">The thing you blurt out shouldn't be the permanent record.</text>

  <!-- ===================== LEFT: TYPICAL ===================== -->
  <g>
    <text x="410" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#e7a3a3" font-family="monospace" letter-spacing="1">TYPICAL MESSAGING</text>

    <!-- node 1 -->
    <g filter="url(#soft)">
      <rect x="110" y="190" width="600" height="86" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="410" y="228" text-anchor="middle" font-size="19" font-weight="600" fill="#f4f5f7">You type in your real, casual voice</text>
    <text x="410" y="254" text-anchor="middle" font-size="16" fill="#a7acb6" font-style="italic">"bro these numbers are wrong 😭 redo the totals"</text>
    <line x1="410" y1="276" x2="410" y2="314" stroke="#6c717c" stroke-width="2" marker-end="url(#arrGray)"/>

    <!-- node 2 -->
    <g filter="url(#soft)">
      <rect x="110" y="322" width="600" height="80" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="410" y="358" text-anchor="middle" font-size="19" font-weight="600" fill="#f4f5f7">Hit send — one version, no filter</text>
    <text x="410" y="382" text-anchor="middle" font-size="15" fill="#a7acb6">What you felt in the moment goes out exactly as-is</text>
    <line x1="410" y1="402" x2="410" y2="440" stroke="#6c717c" stroke-width="2" marker-end="url(#arrGray)"/>

    <!-- node 3 -->
    <g filter="url(#soft)">
      <rect x="110" y="448" width="600" height="80" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="410" y="484" text-anchor="middle" font-size="19" font-weight="600" fill="#f4f5f7">Platform delivers &amp; stores it</text>
    <text x="410" y="508" text-anchor="middle" font-size="15" fill="#a7acb6">Gmail / Slack / WhatsApp keeps it on their terms</text>
    <line x1="410" y1="528" x2="410" y2="566" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>

    <!-- node 4 (danger) -->
    <g filter="url(#soft)">
      <rect x="110" y="574" width="600" height="112" rx="14" fill="#1c1012" stroke="#5a2528"/>
    </g>
    <text x="410" y="610" text-anchor="middle" font-size="20" font-weight="700" fill="#ff8a8a">⚠  Your unfiltered voice = the permanent record</text>
    <text x="410" y="640" text-anchor="middle" font-size="16" fill="#e7a3a3">It lives forever. You can't set it to expire.</text>
    <text x="410" y="666" text-anchor="middle" font-size="16" fill="#e7a3a3">You can't take it back. The casual IS the archive.</text>
  </g>

  <!-- ===================== CENTER: FLIP ===================== -->
  <g transform="translate(840,470)">
    <circle r="66" fill="#15171c" stroke="#2a2f39" stroke-width="2"/>
    <g transform="scale(1.9)" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 -6 a14 14 0 0 1 24 -5"/>
      <path d="M14 6 a14 14 0 0 1 -24 5"/>
      <path d="M8 -16 l4 5 l-6 2" />
      <path d="M-8 16 l-4 -5 l6 -2" />
    </g>
  </g>
  <text x="840" y="566" text-anchor="middle" font-size="18" font-weight="700" fill="#5b9bff" font-family="monospace" letter-spacing="2">REVERSE</text>
  <line x1="840" y1="150" x2="840" y2="396" stroke="#1f232b" stroke-width="2" stroke-dasharray="3 7"/>
  <line x1="840" y1="590" x2="840" y2="900" stroke="#1f232b" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- ===================== RIGHT: BLACKMAIL ===================== -->
  <g>
    <text x="1270" y="166" text-anchor="middle" font-size="22" font-weight="700" fill="#5b9bff" font-family="monospace" letter-spacing="1">BLACKMAIL</text>

    <!-- node 1 -->
    <g filter="url(#soft)">
      <rect x="970" y="190" width="600" height="86" rx="14" fill="url(#blueFill)" stroke="#1d3a6b"/>
      <rect x="970" y="190" width="4" height="86" rx="2" fill="#3b82f6"/>
    </g>
    <text x="1270" y="228" text-anchor="middle" font-size="19" font-weight="600" fill="#f4f5f7">You still write in your real voice</text>
    <text x="1270" y="254" text-anchor="middle" font-size="16" fill="#a7acb6" font-style="italic">same honest draft — nothing lost up front</text>
    <line x1="1270" y1="276" x2="1270" y2="310" stroke="#5b9bff" stroke-width="2" marker-end="url(#arrBlue)"/>

    <!-- split node -->
    <g filter="url(#soft)">
      <rect x="970" y="318" width="600" height="64" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="1270" y="356" text-anchor="middle" font-size="18" font-weight="700" fill="#f4f5f7">One message splits into TWO channels</text>

    <!-- branch arrows -->
    <path d="M1270 382 C1270 404, 1130 404, 1130 426" stroke="#5b9bff" stroke-width="2" fill="none" marker-end="url(#arrBlue)"/>
    <path d="M1270 382 C1270 404, 1410 404, 1410 426" stroke="#5b9bff" stroke-width="2" fill="none" marker-end="url(#arrBlue)"/>

    <!-- public branch -->
    <g filter="url(#soft)">
      <rect x="972" y="432" width="286" height="118" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="1115" y="462" text-anchor="middle" font-size="12" fill="#6c717c" font-family="monospace" letter-spacing="1">PUBLIC CHANNEL</text>
    <text x="1115" y="490" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f5f7">Formal rewrite</text>
    <text x="1115" y="515" text-anchor="middle" font-size="14" fill="#a7acb6">sent through your</text>
    <text x="1115" y="535" text-anchor="middle" font-size="14" fill="#a7acb6">usual app = the record</text>

    <!-- private branch -->
    <g filter="url(#soft)">
      <rect x="1282" y="432" width="286" height="118" rx="14" fill="url(#blueFill)" stroke="#1d3a6b"/>
    </g>
    <text x="1425" y="462" text-anchor="middle" font-size="12" fill="#5b9bff" font-family="monospace" letter-spacing="1">PRIVATE CHANNEL</text>
    <text x="1425" y="490" text-anchor="middle" font-size="17" font-weight="700" fill="#f4f5f7">Encrypted original</text>
    <text x="1425" y="515" text-anchor="middle" font-size="14" fill="#a7acb6">AES-256 · behind a</text>
    <text x="1425" y="535" text-anchor="middle" font-size="14" fill="#a7acb6">5-min, revocable pass</text>

    <line x1="1115" y1="550" x2="1115" y2="584" stroke="#6c717c" stroke-width="2" marker-end="url(#arrGray)"/>
    <line x1="1425" y1="550" x2="1425" y2="584" stroke="#5b9bff" stroke-width="2" marker-end="url(#arrBlue)"/>

    <!-- recombine node -->
    <g filter="url(#soft)">
      <rect x="970" y="590" width="600" height="80" rx="14" fill="#15171c" stroke="#2a2f39"/>
    </g>
    <text x="1115" y="624" text-anchor="middle" font-size="15" fill="#a7acb6">Recipient keeps the</text>
    <text x="1115" y="646" text-anchor="middle" font-size="15" fill="#a7acb6">formal record forever</text>
    <text x="1425" y="624" text-anchor="middle" font-size="15" fill="#9ec3ff">…and unlocks the raw</text>
    <text x="1425" y="646" text-anchor="middle" font-size="15" fill="#9ec3ff">voice only for a moment</text>
    <line x1="1270" y1="590" x2="1270" y2="590"/>
    <line x1="1270" y1="670" x2="1270" y2="708" stroke="#5b9bff" stroke-width="2" marker-end="url(#arrBlue)"/>

    <!-- conclusion -->
    <g filter="url(#soft)">
      <rect x="970" y="716" width="600" height="112" rx="14" fill="#102033" stroke="#2a5aa8"/>
    </g>
    <text x="1270" y="752" text-anchor="middle" font-size="20" font-weight="700" fill="#9ec3ff">✓  The record is intentional — the raw voice is temporary</text>
    <text x="1270" y="782" text-anchor="middle" font-size="16" fill="#cfe0ff">Expires. Revocable. You choose what persists</text>
    <text x="1270" y="808" text-anchor="middle" font-size="16" fill="#cfe0ff">and what fades. The archive is deliberate, not accidental.</text>
  </g>

  <!-- footer takeaway -->
  <rect x="60" y="902" width="1560" height="118" rx="16" fill="#0e0f12" stroke="#1f232b"/>
  <text x="840" y="948" text-anchor="middle" font-size="18" fill="#a7acb6">
    <tspan font-weight="700" fill="#e7a3a3">Everyone assumes:</tspan> the casual message you fire off becomes the permanent record.
  </text>
  <text x="840" y="984" text-anchor="middle" font-size="18" fill="#a7acb6">
    <tspan font-weight="700" fill="#5b9bff">BlackMail flips it:</tspan> the deliberate version is the record — your real voice is the part that can expire.
  </text>
</svg>
