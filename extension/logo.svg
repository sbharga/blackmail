<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BlackMail logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20232b"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tile)" stroke="#2a2f39"/>
  <!-- envelope seam: the "two channels" split -->
  <path d="M10 20 L32 36 L54 20" fill="none" stroke="#3b82f6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <!-- monogram -->
  <text x="20" y="46" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#f4f5f7">b</text>
  <circle cx="42" cy="41" r="4" fill="#5b9bff"/>
</svg>
